plugins {
    id 'com.android.application'
    id 'com.xiaojinzi.kcomponent.plugin'
    alias(libs.plugins.compose.compiler)
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

apply from: "../demo_module.gradle"

/*kotlin {
    sourceSets.main {
        kotlin.srcDir("build/generated/ksp/main/kotlin")
    }
}*/

android {

    namespace 'com.xiaojinzi.component.app2'

    signingConfigs {
        debug {
            storeFile file('./sign')
            storePassword "xiaojinzi"
            keyAlias "xiaojinzi"
            keyPassword "xiaojinzi"
        }
        release {
            storeFile file('./sign')
            storePassword "xiaojinzi"
            keyAlias "xiaojinzi"
            keyPassword "xiaojinzi"
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled = true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    api project(':Demo:module-support')
    api project(':Demo:module-user')
    api project(':Demo:module-base')
}



