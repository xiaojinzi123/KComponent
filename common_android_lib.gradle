android {
    compileSdk = libs.versions.android.compile.sdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.android.min.sdk.get().toInteger()
        targetSdk = libs.versions.android.target.sdk.get().toInteger()
        versionCode 1
        versionName "1.0.0"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (Boolean.parseBoolean(project.findProperty("support.isIncludeKspFolder"))) {
                kotlin {
                    sourceSets {
                        debug.kotlin.srcDirs += 'build/generated/ksp/debug/kotlin'
                    }
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kotlin {
    // 共享脚本不在 buildscript classpath 中，无法 import KGP 的 JvmTarget；
    // jvmToolchain 等价地把 jvmTarget 固定为 17
    jvmToolchain(17)
}

dependencies {

    api libs.material
    api libs.appcompat
    api libs.gson

}
