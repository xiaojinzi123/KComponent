plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

group = 'com.github.xiaojinzi123'
base {
    archivesName = "kcomponent-rx"
}

android {

    namespace 'com.xiaojinzi.component.impl.rx'
    compileSdk libs.versions.android.compile.sdk.get().toInteger()
    defaultConfig {
        minSdk libs.versions.android.min.sdk.get().toInteger()
        targetSdk libs.versions.android.target.sdk.get().toInteger()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

}

kotlin {
    jvmToolchain(17)
}

dependencies {
    compileOnly libs.appcompat
    compileOnly libs.rxjava
    api project(':ComponentImpl')
}

tasks.register('androidSourcesJar', Jar) {
    archiveClassifier.set('sources')
    from fileTree("src/main/java"), fileTree("src/main/kotlin")
}

artifacts {
    archives androidSourcesJar
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = group
                artifactId = base.archivesName.get()
                version = version
            }
        }
    }
}