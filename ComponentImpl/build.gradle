plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

group = 'com.github.xiaojinzi123'
base {
    archivesName = "kcomponent"
}

android {

    namespace 'com.xiaojinzi.component.impl'

    compileSdk libs.versions.android.compile.sdk.get().toInteger()
    defaultConfig {
        minSdk libs.versions.android.min.sdk.get().toInteger()
        targetSdk libs.versions.android.target.sdk.get().toInteger()
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    publishing {
        singleVariant("release") {
            // if you don't want sources/javadoc, remove these lines
            withSourcesJar()
        }
    }

}

kotlin {
    jvmToolchain(17)
}

dependencies {

    androidTestImplementation libs.junit
    androidTestImplementation libs.mockito.core
    androidTestImplementation libs.mockito.android
    androidTestImplementation libs.androidx.junit
    androidTestImplementation(libs.androidx.espresso.core)
    // androidTestImplementation(libs.mockk)

    api libs.appcompat
    api libs.lifecycle.runtime.ktx
    api libs.kotlin.reflect
    api project(':ComponentApi')


}

tasks.register('androidSourcesJar', Jar) {
    archiveClassifier.set('sources')
    from fileTree("src/main/java"), fileTree("src/main/kotlin")
}

artifacts {
    archives androidSourcesJar
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = group
                artifactId = base.archivesName.get()
                version = version
            }
        }
    }
}
